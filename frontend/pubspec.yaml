name: frontend
description: 便携式健康管理系统Flutter前端
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  get: ^4.6.5
  dio: ^5.4.3+1
  shared_preferences: ^2.2.2
  web_socket_channel: ^2.4.0
  flutter_blue_plus: ^1.13.3 # 蓝牙BLE硬件对接
  permission_handler: ^10.2.0 # 权限申请
  intl: ^0.17.0 # 时间格式化
  charts_flutter: ^0.12.0 # 简易数据图表

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/